name: Actualizar agenda

on:
  schedule:
    # 05:00, 12:00 y 18:00 hora de Mexico (UTC-6). Las opciones de cada partido las pide el plugin en vivo, asi que no hace falta mas seguido.
    - cron: '0 11,18,0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  agenda:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Generar agenda
        run: node agenda.js

      - name: Subir lo generado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog meta agenda
          git diff --staged --quiet || git commit -m "Actualiza agenda [skip ci]"
          git pull --rebase -X ours origin main
          git push
