name: Actualizar agenda

on:
  schedule:
    # cada 30 minutos (GitHub puede retrasarlo unos minutos): asi los partidos terminados salen del catalogo
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  agenda:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Generar agenda
        run: node agenda.js

      - name: Subir lo generado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog meta agenda
          git diff --staged --quiet || git commit -m "Actualiza agenda [skip ci]"
          git pull --rebase -X ours origin main
          git push
