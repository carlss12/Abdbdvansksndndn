name: Generar catalogo

on:
  push:
    branches: [main]
    paths: ['channels.json', 'build.js', 'package.json']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Correr build.js
        run: node build.js

      - name: Subir lo generado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json catalog meta logos
          git diff --staged --quiet || git commit -m "Actualiza catalogo [skip ci]"
          git pull --rebase -X ours origin main
          git push
